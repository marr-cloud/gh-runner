name: Publish wiki

# Publishes docs/ to the repository wiki. The wiki must be initialised once
# (create any page in the GitHub UI) before the first run.
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: docs/
          disable-empty-commits: true
